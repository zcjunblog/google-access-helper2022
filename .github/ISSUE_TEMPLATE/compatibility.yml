name: 兼容性与文档反馈
description: 反馈工具兼容、使用说明或排错文档问题
title: '[反馈] '
body:
  - type: markdown
    attributes:
      value: 请先阅读兼容性与排错指南。本仓库维护工具索引和文档；第三方账号与服务由对应项目管理。请勿粘贴密码或完整订阅链接。
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 请填写浏览器名称、完整版本和操作系统。
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: 工具名称或文档页面
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 实际结果与错误信息
      description: 请先删除认证信息及其他隐私内容。
    validations:
      required: true
