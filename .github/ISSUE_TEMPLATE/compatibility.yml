name: 扩展问题与兼容性反馈
description: 反馈扩展功能、兼容性、安装或使用说明问题
title: '[反馈] '
body:
  - type: markdown
    attributes:
      value: 请先阅读安装与排错指南，并提供扩展版本。第三方代理账号与服务由对应项目管理。请勿粘贴密码、私有代理地址或完整订阅链接。
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 请填写浏览器名称、完整版本、操作系统和扩展版本。
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: 工具名称或文档页面
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 实际结果与错误信息
      description: 请先删除认证信息及其他隐私内容。
    validations:
      required: true
